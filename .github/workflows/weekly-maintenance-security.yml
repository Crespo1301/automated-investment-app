name: Weekly Maintenance and Security

on:
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  INVESTMENT_WEB_API_BASE_URL: "http://127.0.0.1:8000"

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web dashboard
        run: npm run build:web

      - name: Audit critical production web dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test API
        run: |
          cd apps/api
          python -m pytest -q
